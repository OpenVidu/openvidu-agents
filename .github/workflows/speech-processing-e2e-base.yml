# Reusable workflow with the shared setup for the Speech Processing agent E2E
# test suites. It is not meant to be run directly: it is called by
# "speech-processing-e2e.yml" (functional tests) and
# "speech-processing-memory-leak-e2e.yml" (memory leak tests), which only differ
# in the Playwright projects they execute (via the "test-npm-script" input).
name: Speech Processing agent E2E tests (reusable)
on:
  workflow_call:
    inputs:
      ref-openvidu-agents:
        description: "Branch, tag or commit SHA to checkout in repository OpenVidu/openvidu-agents"
        type: string
        required: false
        default: ""
      ref-openvidu-agents-pro:
        description: "Branch, tag or commit SHA to checkout in repository OpenVidu/openvidu-agents-pro"
        type: string
        required: false
        default: ""
      ref-openvidu-local-deployment:
        description: "Branch, tag or commit SHA to checkout in repository OpenVidu/openvidu-local-deployment. Defaults to 'development'"
        type: string
        required: false
        default: "development"
      ref-openvidu:
        description: "Branch, tag or commit SHA to checkout in repository OpenVidu/openvidu. Defaults to 'master'"
        type: string
        required: false
        default: "master"
      docker-tag-agent-speech-processing:
        description: "Docker tag for all agent-speech-processing containers. If not provided, the containers will be built from the repository sources"
        type: string
        required: false
        default: ""
      rtc-engine:
        description: "RTC engine to use (mediasoup or pion)"
        type: string
        required: false
        default: "pion"
      ref-openvidu-pro-mediasoup:
        description: 'Branch, tag or commit SHA to checkout in repository OpenVidu/openvidu-pro-mediasoup. If "default" mediasoup-worker binary will not be compiled: artifact from latest release of OpenVidu/openvidu-pro-mediasoup will be used'
        type: string
        required: false
        default: "default"
      test-npm-script:
        description: "npm script (defined in openvidu-agents/test/package.json) used to run the Playwright tests"
        type: string
        required: true
      runs-on:
        description: "Runner label the test job executes on. Defaults to ubuntu-latest; GPU callers pass the AWS EC2 self-hosted runner label."
        type: string
        required: false
        default: "ubuntu-latest"
      gpu:
        description: "Run the GPU-accelerated provider suite: build/use the -cuda12 sherpa image and enable GPU passthrough (docker_options.gpus=all) to the agent container. Requires a GPU runner."
        type: boolean
        required: false
        default: false
jobs:
  test:
    timeout-minutes: 120
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install safe-chain
        uses: OpenVidu/actions/install-safe-chain@000cbf6a8b545a5588f11028f71fe18a54c18579 # v1.0.27

      - name: Checkout OpenVidu/openvidu-agents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref-openvidu-agents || github.sha }}
          path: openvidu-agents

      - name: Checkout OpenVidu/openvidu-agents-pro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenVidu/openvidu-agents-pro
          ref: ${{ inputs.ref-openvidu-agents-pro || 'main' }}
          token: ${{ secrets.OPENVIDU_GITHUB_TOKEN }}
          path: openvidu-agents-pro

      - name: Download STT model files
        working-directory: ./openvidu-agents/speech-processing
        # The Nemotron 3.5 export baked into the sherpa image follows the
        # acceleration: int8 for the CPU image, float32 for -cuda12 (int8
        # graphs cannot run on the CUDA provider).
        run: ./download-models.sh --accel ${{ inputs.gpu && 'cuda12' || 'cpu' }}

      - name: Checkout OpenVidu/openvidu
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenVidu/openvidu
          ref: ${{ inputs.ref-openvidu || 'master' }}
          path: openvidu

      - name: Build agent containers [-cloud, -vosk, -sherpa]
        if: ${{ !inputs.gpu && inputs.docker-tag-agent-speech-processing == '' }}
        run: |
          cd openvidu-agents/speech-processing
          # The base image carries the agent code. It gets a name that does not exist on Docker
          # Hub, so the cloud and vosk builds can only use this one: under the published name the
          # cloud build took the published base, and with it the last released code.
          base=openvidu-e2e/agent-speech-processing-base:local
          docker build --no-cache -f Dockerfile.base -t "$base" .
          docker buildx build --builder default --load --no-cache --build-arg BASE_IMAGE="$base" \
            -f Dockerfile.cloud -t openvidu/agent-speech-processing-cloud:main .
          ./build-vosk.sh --no-cache --local-only --parent-base-image "$base"
          cd ../../openvidu-agents-pro/speech-processing
          export GITHUB_TOKEN=${{ secrets.OPENVIDU_GITHUB_TOKEN }}
          ./build-sherpa.sh --no-cache --local-only

      - name: Check the cloud and vosk images hold the checked-out code
        if: ${{ !inputs.gpu && inputs.docker-tag-agent-speech-processing == '' }}
        working-directory: ./openvidu-agents/speech-processing
        run: |
          expected=$(sha256sum main.py stt_impl.py vad_stt_wrapper.py)
          for image in openvidu/agent-speech-processing-cloud:main openvidu/agent-speech-processing-vosk:main; do
            actual=$(docker run --rm --entrypoint sh "$image" -c 'cd /app && sha256sum main.py stt_impl.py vad_stt_wrapper.py')
            if [ "$actual" != "$expected" ]; then
              echo "::error::$image does not hold the checked-out agent code"
              diff <(echo "$expected") <(echo "$actual") || true
              exit 1
            fi
          done
          echo "Both images hold the checked-out agent code"

      - name: Build agent containers [-sherpa-cuda12]
        if: ${{ inputs.gpu && inputs.docker-tag-agent-speech-processing == '' }}
        run: |
          cd openvidu-agents-pro/speech-processing
          export GITHUB_TOKEN=${{ secrets.OPENVIDU_GITHUB_TOKEN }}
          # --local-only builds for the runner's own architecture (amd64 or arm64)
          ./build-sherpa.sh --no-cache --local-only --accel cuda12

      # The image must hold our prebuilt cuda12 wheel for the runner's architecture: version
      # "<sherpa>+cuda" (k2-fsa's are "+cuda12.cudnn9", PyPI's have no CUDA) bundling the ORT
      # version pinned in Dockerfile.sherpa-base, with its CUDA provider library.
      - name: Check the sherpa-onnx wheel of the -sherpa-cuda12 image
        if: ${{ inputs.gpu }}
        working-directory: ./openvidu-agents-pro/speech-processing
        run: |
          sherpa=$(sed -n 's/^ARG SHERPA_ONNX_VERSION=//p' Dockerfile.sherpa-base)
          ort=$(sed -n 's/^ARG SHERPA_ONNX_GPU_ONNXRUNTIME_VERSION=//p' Dockerfile.sherpa-base)
          docker run --rm -i --entrypoint python3 openvidu/agent-speech-processing-sherpa-cuda12:main - "$sherpa" "$ort" <<'PY'
          import ctypes, glob, os, platform, sys
          import sherpa_onnx
          want_sherpa, want_ort = sys.argv[1:]
          lib_dir = os.path.join(os.path.dirname(sherpa_onnx.__file__), "lib")
          F = ctypes.CFUNCTYPE(ctypes.c_char_p)
          B = type("B", (ctypes.Structure,), {"_fields_": [("GetApi", ctypes.c_void_p), ("GetVersionString", F)]})
          ort = ctypes.CDLL(glob.glob(lib_dir + "/libonnxruntime.so*")[0])
          ort.OrtGetApiBase.restype = ctypes.POINTER(B)
          ort_version = ort.OrtGetApiBase().contents.GetVersionString().decode()
          cuda = bool(glob.glob(lib_dir + "/libonnxruntime_providers_cuda.so"))
          print(f"{platform.machine()}: sherpa-onnx {sherpa_onnx.__version__}, bundled ORT {ort_version}, CUDA provider: {cuda}")
          if sherpa_onnx.__version__ != f"{want_sherpa}+cuda" or ort_version != want_ort or not cuda:
              print(f"::error::expected sherpa-onnx {want_sherpa}+cuda bundling ORT {want_ort} with its CUDA provider")
              sys.exit(1)
          PY

      - name: Install openvidu-testapp dependencies
        working-directory: ./openvidu/openvidu-testapp
        run: npm ci

      - name: Run openvidu-testapp
        working-directory: ./openvidu/openvidu-testapp
        run: npm start 2>&1 >> ./openvidu-testapp.log &

      - name: Setup mediasoup-worker
        if: ${{ inputs.rtc-engine == 'mediasoup' }}
        id: setup-mediasoup-worker
        uses: OpenVidu/actions/setup-mediasoup-worker@000cbf6a8b545a5588f11028f71fe18a54c18579 # v1.0.27
        with:
          ref-openvidu-pro-mediasoup: ${{ inputs.ref-openvidu-pro-mediasoup }}
          github-token: ${{ secrets.OPENVIDU_GITHUB_TOKEN }}

      - name: Setup OpenVidu Local Deployment
        uses: OpenVidu/actions/start-openvidu-local-deployment@000cbf6a8b545a5588f11028f71fe18a54c18579 # v1.0.27
        with:
          ref-openvidu-local-deployment: ${{ inputs.ref-openvidu-local-deployment || 'development' }}
          pre_startup_commands: "sed -i 's|docker_image: docker.io/openvidu/agent-speech-processing-cloud:main|docker_image: docker.io/openvidu/agent-speech-processing-cloud:${{ inputs.docker-tag-agent-speech-processing || 'main' }}|g' agent-speech-processing.yaml"
          mediasoup-worker-bin: ${{ steps.setup-mediasoup-worker.outputs.MEDIASOUP_WORKER_BIN }}
          openvidu-edition: "pro"
          rtc-engine: ${{ inputs.rtc-engine }}
          github-token: ${{ secrets.OPENVIDU_GITHUB_TOKEN }}

      - name: Run tests
        run: |
          cd openvidu-agents/test
          npm ci
          # Install Playwright browsers
          mkdir -p /tmp/ms-playwright
          PLAYWRIGHT_BROWSERS_PATH=/tmp/ms-playwright npx playwright install --with-deps chromium
          npm run ${{ inputs.test-npm-script }}
        env:
          RUN_MODE: CI
          LOCAL_DEPLOYMENT_BASE_PATH: ../../openvidu-local-deployment
          PLAYWRIGHT_BROWSERS_PATH: /tmp/ms-playwright
          OPENVIDU_PRO_LICENSE: ${{ secrets.OPENVIDU_PRO_LICENSE }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          GOOGLE_CREDENTIALS_INFO: ${{ secrets.GOOGLE_CREDENTIALS_INFO }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          GLADIA_API_KEY: ${{ secrets.GLADIA_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SPEECHMATICS_API_KEY: ${{ secrets.SPEECHMATICS_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          SONIOX_API_KEY: ${{ secrets.SONIOX_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SPITCH_API_KEY: ${{ secrets.SPITCH_API_KEY }}
          ELEVEN_API_KEY: ${{ secrets.ELEVEN_API_KEY }}
          SIMPLISMART_API_KEY: ${{ secrets.SIMPLISMART_API_KEY }}
          # FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          # MISTRALAI_API_KEY: ${{ secrets.MISTRALAI_API_KEY }}
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # CLOVA_API_KEY: ${{ secrets.CLOVA_API_KEY }}

      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@dbb08957b5b2af918b39136ab2c5532002c7649b # v1.3.2
        with:
          report-path: "openvidu-agents/test/test-results/ctrf-report.json"
          use-suite-name: true
        if: always()

      - name: Upload failed test videos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-videos
          path: openvidu-agents/test/test-results/**/*.webm
          retention-days: 2

      - name: Clean up
        if: always()
        uses: OpenVidu/actions/cleanup@000cbf6a8b545a5588f11028f71fe18a54c18579 # v1.0.27
